<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memnet Flashcards</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --line: #d0d7de;
    --text: #1f2328;
    --muted: #656d76;
    --btn-bg: #f6f8fa;
    --btn-hover: #eaeef2;
    --green: #1a7f37;
    --green-soft: #dafbe1;
    --amber: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --panel: #0d1117;
      --line: #30363d;
      --text: #e6edf3;
      --muted: #8d96a0;
      --btn-bg: #21262d;
      --btn-hover: #30363d;
      --green: #3fb950;
      --green-soft: #12261e;
      --amber: #d29922;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-size: 24px; margin: 0 0 4px; font-weight: 600; }
  header p { margin: 0 0 20px; color: var(--muted); }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .tabs { display: flex; gap: 4px; }
  .tab {
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--text);
    padding: 4px 12px; border-radius: 6px; cursor: pointer; font: inherit;
  }
  .tab[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .progress { color: var(--muted); font-size: 13px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .bar > div { height: 100%; width: 0; background: var(--green); transition: width .25s; }

  ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  li {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px; background: var(--panel);
    border-top: 1px solid var(--line);
  }
  li:first-child { border-top: 0; }
  .info { flex: 1; min-width: 0; }
  .word { font-size: 16px; font-weight: 600; color: var(--text); }
  .pos { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; font-style: italic; }
  .desc { color: var(--muted); margin-top: 2px; }
  li.known .word { color: var(--green); }

  .toggle {
    flex: none; min-width: 112px; text-align: center;
    border: 1px solid var(--line); background: var(--btn-bg); color: var(--text);
    padding: 7px 16px; min-height: 36px; border-radius: 6px; font: inherit; font-weight: 500; cursor: pointer;
  }
  @media (hover: hover) { .toggle:hover { background: var(--btn-hover); } }
  /* Following-style state: shows "Known", swaps to "Still learning" on hover */
  .toggle.on { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .toggle.on .hover-label { display: none; }
  @media (hover: hover) {
    .toggle.on:hover .label { display: none; }
    .toggle.on:hover .hover-label { display: inline; }
    .toggle.on:hover { color: var(--amber); border-color: var(--amber); background: var(--btn-bg); }
  }
  .toggle:not(.on) .hover-label { display: none; }

  .decks { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  .deck {
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 8px 12px; font: inherit; cursor: pointer; white-space: nowrap;
  }
  .deck:hover { color: var(--text); }
  .deck[aria-current="true"] { color: var(--text); border-bottom-color: #fd8c73; font-weight: 600; }
  .deck .n {
    margin-left: 6px; background: var(--btn-bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 7px; font-size: 12px; font-weight: 400; color: var(--muted);
  }
  ul[data-deck="vim"] .word, ul[data-deck="python"] .word {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px;
  }
  .search {
    width: 100%; padding: 7px 12px; margin-bottom: 8px; font: inherit;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px;
  }
  .search::placeholder { color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .options { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 14px; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
  .reveal {
    background: none; border: 1px dashed var(--line); color: var(--muted);
    font: inherit; font-size: 13px; padding: 2px 10px; margin-top: 4px;
    border-radius: 6px; cursor: pointer;
  }
  .reveal:hover { color: var(--text); border-color: var(--muted); }
  .reveal:focus-visible, .check input:focus-visible { outline: 2px solid #388bfd; outline-offset: 2px; }
  kbd {
    font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--btn-bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  }
  .notice {
    border: 1px solid var(--amber); color: var(--amber);
    border-radius: 6px; padding: 8px 12px; margin-bottom: 12px;
  }
  .notice[hidden], .toast[hidden], .toast button[hidden] { display: none; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center; z-index: 10;
    background: var(--text); color: var(--bg);
    padding: 10px 14px; border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: calc(100% - 32px);
  }
  .toast button {
    background: none; border: 0; color: inherit; font: inherit;
    font-weight: 600; text-decoration: underline; cursor: pointer; padding: 4px;
  }
  li.sel { outline: 2px solid #388bfd; outline-offset: -2px; }
  .toggle:focus-visible, .deck:focus-visible, .tab:focus-visible,
  .reset:focus-visible, .toast button:focus-visible, .search:focus-visible {
    outline: 2px solid #388bfd; outline-offset: 2px;
  }
  @media (hover: none) { .hint { display: none; } }
  @media (max-width: 560px) {
    main { padding: 20px 12px 64px; }
    li { gap: 12px; padding: 12px; }
    .toggle { min-width: 92px; padding: 7px 10px; min-height: 40px; }
  }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .reset { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; text-decoration: underline; padding: 6px 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Memnet Flashcards</h1>
    <p>Pick a deck and mark cards as known. Click again to send one back to learning.</p>
  </header>

  <div class="decks" id="decks"></div>

  <div class="notice" id="notice" role="alert" hidden>
    Progress can't be saved in this browser, so it will last only until you close this page.
  </div>

  <input class="search" id="q" type="search" placeholder="Search terms, descriptions, categories" aria-label="Search cards" autocomplete="off">
  <p class="hint"><kbd>/</kbd> search &middot; <kbd>j</kbd> <kbd>k</kbd> move &middot; <kbd>Space</kbd> toggle &middot; <kbd>r</kbd> reveal &middot; <kbd>Esc</kbd> clear</p>
  <div class="options">
    <label class="check"><input type="checkbox" id="hideDefs"> Hide definitions</label>
    <label class="check"><input type="checkbox" id="shuffle"> Shuffle</label>
  </div>

  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab" data-filter="all" aria-pressed="true">All</button>
      <button class="tab" data-filter="learning" aria-pressed="false">Still learning</button>
      <button class="tab" data-filter="known" aria-pressed="false">Known</button>
    </div>
    <div class="progress"><span id="count"></span> <button class="reset" id="reset">reset</button></div>
  </div>
  <div class="bar"><div id="fill"></div></div>

  <ul id="list"></ul>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toastMsg"></span>
    <button type="button" id="toastUndo">Undo</button>
  </div>
</main>

    { w: "austere",     p: "adj.", d: "Severely plain, with no luxury or ornament." },

    { w: "eclectic",    p: "adj.", d: "Drawing from a wide range of sources or styles." },
    { w: "efficacy",    p: "noun", d: "The ability to produce a desired result." },
    { w: "enervate",    p: "verb", d: "To drain of energy or vitality." },
    { w: "esoteric",    p: "adj.", d: "Understood by only a small number of specialists." },

    { w: "idiosyncratic", p: "adj.", d: "Peculiar to one individual." },

    { w: "insouciant",  p: "adj.", d: "Showing a casual lack of concern." },

    { w: "inure",       p: "verb", d: "To accustom to something unpleasant until it is tolerable." },
    { w: "juxtapose",   p: "verb", d: "To place side by side for contrast or comparison." },

  const VIM = [

    { w: "$", p: "motion", d: "Jump to the end of the line." },

    { w: "G", p: "motion", d: "Jump to the last line of the file." },
    { w: "%", p: "motion", d: "Jump to the matching bracket, brace, or parenthesis." },

    { w: ";", p: "motion", d: "Repeat the last f, F, t, or T motion." },
    { w: "{ }", p: "motion", d: "Move to the previous or next blank line (paragraph boundary)." },
    { w: "Ctrl-d / Ctrl-u", p: "scroll", d: "Scroll half a page down or up." },
    { w: "zz", p: "scroll", d: "Center the screen on the cursor line." },
    { w: "i", p: "insert", d: "Enter insert mode before the cursor." },
    { w: "a", p: "insert", d: "Enter insert mode after the cursor." },
    { w: "I", p: "insert", d: "Enter insert mode at the first non-blank character of the line." },
    { w: "A", p: "insert", d: "Enter insert mode at the end of the line." },
    { w: "o", p: "insert", d: "Open a new line below and enter insert mode." },
    { w: "O", p: "insert", d: "Open a new line above and enter insert mode." },

    { w: "dd", p: "edit", d: "Delete the current line." },
    { w: "yy", p: "edit", d: "Yank (copy) the current line." },

    { w: "u", p: "edit", d: "Undo the last change." },
    { w: "Ctrl-r", p: "edit", d: "Redo the last undone change." },

  const PYTHON = [

  const DECKS = {

  let deck = "vocab";

  const KEY = "wordlist-known-v1";

  function probeStorage() {
    try {
      localStorage.setItem("wordlist-probe", "1");
      localStorage.removeItem("wordlist-probe");
      return true;
    } catch (e) { return false; }
  }
  let storageOk = probeStorage();

  let known = new Set();
  try {
    const stored = localStorage.getItem(KEY);
    if (stored) {
      const raw = JSON.parse(stored);
      if (Array.isArray(raw)) {
        // Older saves had bare words (all vocabulary); give them the vocab prefix.
        known = new Set(raw
          .filter(k => typeof k === "string")
          .map(k => k.includes(":") ? k : "vocab:" + k));
      }
    }
  } catch (e) { /* malformed saved data is ignored */ }

  let filter = "all";
  let query = "";
  let selectedKey = null;
  let hideDefs = false;
  let shuffled = false;
  const revealed = new Set();
  const ranks = {};

  function makeOrder() {
    Object.keys(DECKS).forEach(id => {
      const idx = DECKS[id].items.map((_, i) => i);
      for (let i = idx.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [idx[i], idx[j]] = [idx[j], idx[i]];
      }
      const m = new Map();
      idx.forEach((original, rank) => m.set(DECKS[id].items[original].w, rank));
      ranks[id] = m;
    });
  }

  const list = document.getElementById("list");
  const count = document.getElementById("count");
  const fill = document.getElementById("fill");
  const q = document.getElementById("q");
  const notice = document.getElementById("notice");
  const toast = document.getElementById("toast");
  const toastMsg = document.getElementById("toastMsg");
  const toastUndo = document.getElementById("toastUndo");

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify([...known]));
      storageOk = true;
    } catch (e) { storageOk = false; }
    notice.hidden = storageOk;
  }

  function keyOf(item) { return deck + ":" + item.w; }

  function matches(item) {
    const terms = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return true;
    const hay = (item.w + " " + item.d + " " + item.p).toLowerCase();
    return terms.every(t => hay.includes(t));
  }

  function visible() {
    const items = DECKS[deck].items.filter(item => {
      const isKnown = known.has(keyOf(item));
      if (filter === "known" && !isKnown) return false;
      if (filter === "learning" && isKnown) return false;
      return matches(item);
    });
    if (shuffled && ranks[deck]) items.sort((a, b) => ranks[deck].get(a.w) - ranks[deck].get(b.w));
    return items;
  }

  // Toast with optional undo
  let toastTimer = null;
  let currentUndo = null;
  function hideToast() {
    toast.hidden = true;
    currentUndo = null;
    clearTimeout(toastTimer);
  }
  function showToast(msg, undo) {
    toastMsg.textContent = msg;
    currentUndo = undo || null;
    toastUndo.hidden = !undo;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 7000);
  }
  toastUndo.addEventListener("click", () => {
    const fn = currentUndo;
    hideToast();
    if (fn) fn();
  });

  // Decks: built once so their buttons keep focus across updates
  const deckButtons = {};
  Object.keys(DECKS).forEach(id => {
    const b = document.createElement("button");
    b.className = "deck";
    b.append(DECKS[id].name);
    const n = document.createElement("span");
    n.className = "n";
    b.appendChild(n);
    b.addEventListener("click", () => { deck = id; selectedKey = null; render(); });
    document.getElementById("decks").appendChild(b);
    deckButtons[id] = { b, n };
  });

  function updateDecks() {
    Object.keys(DECKS).forEach(id => {
      const total = DECKS[id].items.length;
      const done = DECKS[id].items.filter(i => known.has(id + ":" + i.w)).length;
      deckButtons[id].n.textContent = done + "/" + total;
      deckButtons[id].b.setAttribute("aria-current", id === deck ? "true" : "false");
    });
  }

  function render(opts) {
    opts = opts || {};
    const hadListFocus = list.contains(document.activeElement);
    const vis = visible();

    // If the selected card left the view, move the selection to its neighbour
    if (selectedKey && !vis.some(i => keyOf(i) === selectedKey)) {
      selectedKey = (opts.fromIndex != null && vis.length)
        ? keyOf(vis[Math.min(opts.fromIndex, vis.length - 1)])
        : null;
    }

    list.innerHTML = "";
    list.dataset.deck = deck;

    vis.forEach(item => {
      const key = keyOf(item);
      const isKnown = known.has(key);

      const li = document.createElement("li");
      li.dataset.key = key;
      if (isKnown) li.classList.add("known");
      if (key === selectedKey) li.classList.add("sel");

      const info = document.createElement("div");
      info.className = "info";
      const word = document.createElement("div");
      word.className = "word";
      word.textContent = item.w;
      const pos = document.createElement("span");
      pos.className = "pos";
      pos.textContent = item.p;
      word.appendChild(pos);
      info.append(word);
      if (hideDefs && !revealed.has(key)) {
        const r = document.createElement("button");
        r.type = "button";
        r.className = "reveal";
        r.textContent = "Show definition";
        r.setAttribute("aria-label", "Show definition of " + item.w);
        r.addEventListener("click", () => { revealed.add(key); selectedKey = key; render({ focus: true }); });
        info.append(r);
      } else {
        const desc = document.createElement("div");
        desc.className = "desc";
        desc.textContent = item.d;
        info.append(desc);
      }

      const btn = document.createElement("button");
      btn.className = "toggle" + (isKnown ? " on" : "");
      btn.setAttribute("aria-label",
        isKnown ? "Mark " + item.w + " as still learning" : "Mark " + item.w + " as known");
      btn.innerHTML = isKnown
        ? '<span class="label">Known</span><span class="hover-label">Still learning</span>'
        : '<span class="label">I know it</span>';
      btn.addEventListener("click", () => toggle(item));

      li.append(info, btn);
      list.appendChild(li);
    });

    if (!vis.length) {
      const li = document.createElement("li");
      li.className = "empty";
      if (query.trim()) {
        li.textContent = "No matching cards in " + DECKS[deck].name +
          (filter === "all" ? "." : " for this filter.");
      } else if (filter === "known") {
        li.textContent = "Nothing marked as known yet.";
      } else if (filter === "learning") {
        li.textContent = "Everything is known. Nice.";
      } else {
        li.textContent = "This deck has no cards.";
      }
      list.appendChild(li);
    }

    const items = DECKS[deck].items;
    const n = items.filter(i => known.has(keyOf(i))).length;
    count.textContent = n + " of " + items.length + " known" +
      (vis.length !== items.length ? " \u00b7 " + vis.length + " shown" : "");
    fill.style.width = (n / items.length * 100) + "%";
    updateDecks();

    if (hadListFocus || opts.focus) {
      const b = list.querySelector("li.sel .toggle");
      if (b) b.focus();
    }
  }

  function toggle(item) {
    const key = keyOf(item);
    const was = known.has(key);
    const idx = visible().indexOf(item);
    if (was) known.delete(key); else known.add(key);
    save();
    selectedKey = key;
    const stillShown = visible().includes(item);
    render({ fromIndex: idx });
    if (!stillShown) {
      showToast('"' + item.w + '" marked ' + (was ? "still learning" : "known") + ".", () => {
        if (was) known.add(key); else known.delete(key);
        save();
        selectedKey = key;
        render();
      });
    }
  }

  // Keyboard selection
  function setSelClass() {
    list.querySelectorAll("li.sel").forEach(li => li.classList.remove("sel"));
    const li = [...list.children].find(el => el.dataset.key === selectedKey);
    if (li) li.classList.add("sel");
    return li;
  }

  function move(delta) {
    const vis = visible();
    if (!vis.length) return;
    let i = vis.findIndex(it => keyOf(it) === selectedKey);
    if (i === -1) i = delta > 0 ? 0 : vis.length - 1;
    else i = Math.max(0, Math.min(vis.length - 1, i + delta));
    selectedKey = keyOf(vis[i]);
    const li = setSelClass();
    if (li) li.querySelector(".toggle").focus();
  }

  list.addEventListener("focusin", e => {
    const li = e.target.closest("li[data-key]");
    if (li && li.dataset.key !== selectedKey) {
      selectedKey = li.dataset.key;
      setSelClass();
    }
  });

  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    const typing = t.matches && t.matches("input:not([type=checkbox]), textarea, select, [contenteditable]");
    if (typing) {
      if (e.key === "Escape" && t === q) {
        if (q.value) { q.value = ""; query = ""; render(); }
        else q.blur();
      }
      return;
    }
    if (e.key === "/") { e.preventDefault(); q.focus(); q.select(); }
    else if (e.key === "j") { move(1); }
    else if (e.key === "k") { move(-1); }
    else if (e.key === "u" && !toast.hidden && currentUndo) {
      const fn = currentUndo;
      hideToast();
      fn();
    }
    else if (e.key === "r") {
      if (hideDefs && selectedKey && !revealed.has(selectedKey)) {
        revealed.add(selectedKey);
        render({ focus: true });
      }
    }
    else if (e.key === " " && t.tagName !== "BUTTON" && t.tagName !== "A" && t.tagName !== "INPUT") {
      const item = visible().find(it => keyOf(it) === selectedKey);
      if (item) { e.preventDefault(); toggle(item); }
    }
  });

  q.addEventListener("input", () => { query = q.value; render(); });

  document.getElementById("tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab");
    if (!t) return;
    filter = t.dataset.filter;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", b === t));
    render();
  });

  document.getElementById("reset").addEventListener("click", () => {
    const removed = [...known].filter(k => k.startsWith(deck + ":"));
    if (!removed.length) { showToast("Nothing to reset in " + DECKS[deck].name + "."); return; }
    removed.forEach(k => known.delete(k));
    save();
    selectedKey = null;
    render();
    showToast("Progress reset for " + DECKS[deck].name + ".", () => {
      removed.forEach(k => known.add(k));
      save();
      render();
    });
  });

  document.getElementById("hideDefs").addEventListener("change", e => {
    hideDefs = e.target.checked;
    revealed.clear();
    render();
  });
  document.getElementById("shuffle").addEventListener("change", e => {
    shuffled = e.target.checked;
    if (shuffled) makeOrder();
    render();
  });

  notice.hidden = storageOk;
  render();
</script>
</body>
</html>
